name: Build APK 3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and check version
        run: |
          for z in ./*.zip; do unzip -o -q "$z"; done
          find . -name settings.gradle.kts -not -path "./.git/*"
          grep -rq "NOTHING_MS" --include=DonatorService.kt . || (echo "OLD ZIP - not the latest version" && exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          d=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          cd "$d"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClanDonator-apk
          path: out/*.apk
